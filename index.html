        /* ========== 全局重置与基础样式 ========== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: linear-gradient(145deg, #e6f0ff 0%, #b8d8f0 100%);
            min-height: 100vh;
            padding: 3rem 1.5rem;
            margin: 0;
            position: relative;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* 背景光晕 */
        body::before {
            content: '';
            position: fixed;
            top: -20%;
            left: -10%;
            width: 70%;
            height: 70%;
            background: radial-gradient(circle, rgba(160, 210, 255, 0.5) 0%, transparent 70%);
            border-radius: 50%;
            filter: blur(60px);
            z-index: 0;
            pointer-events: none;
        }

        body::after {
            content: '';
            position: fixed;
            bottom: -15%;
            right: -10%;
            width: 60%;
            height: 60%;
            background: radial-gradient(circle, rgba(120, 190, 255, 0.4) 0%, transparent 70%);
            border-radius: 50%;
            filter: blur(70px);
            z-index: 0;
            pointer-events: none;
        }

        /* ========== 真正的全透毛玻璃卡片样式 ========== */
        .glass-card {
            position: relative;
            z-index: 10;
            max-width: 680px;
            width: 100%;
            background: rgba(255, 255, 255, 0.15); 
            backdrop-filter: blur(24px) saturate(150%);
            -webkit-backdrop-filter: blur(24px) saturate(150%);
            border-radius: 2.5rem;
            border: 1px solid rgba(255, 255, 255, 0.4); 
            box-shadow: 0 25px 45px -15px rgba(70, 130, 200, 0.2),
                        0 0 0 1px rgba(255, 255, 255, 0.2) inset;
            padding: 2.8rem 2.5rem;
            color: #1a3a5c;
            transition: transform 0.4s cubic-bezier(0.2, 0.9, 0.3, 1), box-shadow 0.4s ease;
            animation: cardAppear 0.9s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            margin-bottom: 2.5rem; 
        }

        .glass-card:last-child {
            margin-bottom: 0;
        }

        .glass-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 35px 55px -18px rgba(70, 140, 220, 0.3),
                        0 0 0 1px rgba(255, 255, 255, 0.4) inset;
        }

        @keyframes cardAppear {
            0% { opacity: 0; transform: translateY(30px) scale(0.98); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* ========== 统一的按钮样式（通透感毛玻璃按钮） ========== */
        .unified-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.8rem;
            background: rgba(255, 255, 255, 0.3); 
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 1rem 2rem;
            border-radius: 3rem;
            border: 1px solid rgba(255, 255, 255, 0.5);
            color: #1a3a5c;
            font-size: 1.15rem;
            font-weight: 600;
            text-decoration: none;
            letter-spacing: 0.5px;
            transition: all 0.35s cubic-bezier(0.2, 0.9, 0.4, 1);
            box-shadow: 0 8px 18px -6px rgba(70, 130, 210, 0.15);
            cursor: pointer;
            width: 100%;
            white-space: nowrap;
        }

        .unified-btn:hover {
            background: rgba(255, 255, 255, 0.5);
            border-color: rgba(255, 255, 255, 0.8);
            box-shadow: 0 15px 30px -8px rgba(70, 140, 230, 0.3);
            transform: scale(1.03) translateY(-2px);
        }

        .unified-btn:active {
            transform: scale(0.98);
        }

        .unified-btn i {
            font-size: 1.4rem;
            color: #1e4f86;
            filter: drop-shadow(0 0 8px rgba(255,255,255,0.8));
            flex-shrink: 0;
        }

        /* ========== 第一屏：个人信息卡片 ========== */
        .profile-header {
            display: flex;
            align-items: center;
            gap: 1.8rem;
            margin-bottom: 2.2rem;
            flex-wrap: wrap;
        }

        .avatar {
            width: 95px;
            height: 95px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.6);
            box-shadow: 0 8px 20px -6px rgba(100, 160, 230, 0.3);
            transition: transform 0.3s ease;
            flex-shrink: 0;
            overflow: hidden;
            border: 2px solid #ffffff;
        }

        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            image-rendering: -moz-crisp-edges; 
            image-rendering: -webkit-optimize-contrast;
            image-rendering: crisp-edges;
            image-rendering: pixelated; 
        }

        .avatar:hover {
            transform: scale(1.04);
        }

        .name-title h1 {
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 0.3rem;
            background: linear-gradient(120deg, #1e4a7a, #2b6fae);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 2px 15px rgba(255, 255, 255, 0.5);
            white-space: nowrap;
        }

        .name-title .subhead {
            font-size: 1.1rem;
            font-weight: 400;
            color: #2b5a86;
            letter-spacing: 0.3px;
            display: flex;
            align-items: center;
            gap: 0.4rem;
            opacity: 0.95;
            white-space: nowrap;
        }

        .contact-info {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .contact-item {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 0.9rem 1.4rem;
            background: rgba(255, 255, 255, 0.25); 
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-radius: 2rem;
            border: 1px solid rgba(255, 255, 255, 0.4);
            transition: background 0.3s ease, border-color 0.3s ease, transform 0.2s ease;
            text-decoration: none;
        }

        .contact-item:hover {
            background: rgba(255, 255, 255, 0.45);
            border-color: rgba(255, 255, 255, 0.7);
            transform: translateX(5px);
        }

        .contact-item i {
            font-size: 1.4rem;
            width: 2rem;
            text-align: center;
            color: #2b6fae;
            flex-shrink: 0;
        }

        .contact-text {
            font-size: 1.15rem;
            font-weight: 500;
            color: #1f3e5e;
            letter-spacing: 0.3px;
            word-break: break-all;
            overflow-wrap: break-word;
        }

        .action-section {
            display: flex;
            justify-content: center;
        }

        /* ========== 第二、第三屏：内容卡片 ========== */
        .content-card {
            text-align: center;
            animation-delay: 0.1s;
        }

        .card-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: #1e4a7a;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
        }

        .card-title i {
            color: #2b6fae;
        }

        .resource-desc {
            font-size: 1rem;
            color: #2b5a86;
            margin-bottom: 1.8rem;
            line-height: 1.5;
        }

        /* 资源包信息列表 */
        .pack-info-list {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
            margin-bottom: 2rem;
            padding: 0.5rem 1rem;
            border-top: 1px solid rgba(255, 255, 255, 0.3);
            border-bottom: 1px solid rgba(255, 255, 255, 0.3);
        }

        .pack-info-item {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.8rem;
            font-size: 1.05rem;
            color: #1f3e5e;
        }

        .pack-info-item i {
            color: #2b6fae;
            font-size: 1.1rem;
            width: 1.2rem;
            text-align: center;
        }

        .pack-info-item strong {
            font-weight: 600;
            color: #1e4a7a;
            margin-right: 0.3rem;
        }

        /* ========== 响应式调整 ========== */
        @media (max-width: 900px) and (min-width: 601px) {

            .avatar { width: 80px; height: 80px; }
            .name-title h1 { font-size: 1.8rem; white-space: normal; }
            .name-title .subhead { justify-content: center; font-size: 1rem; white-space: normal; }
            .contact-item { padding: 0.7rem 1.2rem; gap: 0.8rem; }
            .contact-item i { font-size: 1.2rem; width: 1.8rem; }
            .contact-text { font-size: 1rem; }
            
            .card-title { font-size: 1.3rem; }
            .pack-info-item { flex-direction: column; gap: 0.2rem; text-align: center; } 
            
            .unified-btn { font-size: 1rem; padding: 0.9rem 1rem; gap: 0.5rem; }
            .unified-btn i { font-size: 1.2rem; }
        }

        @media (max-width: 380px) {
            .glass-card { padding: 1.5rem 1.2rem; border-radius: 1.5rem; }
            .contact-item { flex-wrap: wrap; gap: 0.5rem; padding: 0.6rem 1rem; }
            .contact-text { font-size: 0.95rem; }
            .avatar { width: 70px; height: 70px; }
            .name-title h1 { font-size: 1.6rem; }
            .unified-btn { font-size: 0.95rem; padding: 0.8rem 0.8rem; }
        }
    </style>
